(async()=>{const host=document.getElementById('reader'),esc=StudyData.esc;try{
 const id=new URLSearchParams(location.search).get('id')||'';let title,source,summary,points,exam,subject;
 if(id.startsWith('ncert-note:')){const [,s,b,c]=id.split(':');if(!['history','geography','polity','economy','science','environment'].includes(s))throw Error('Unknown subject');const response=await fetch('/data/ncert-'+s+'.json');if(!response.ok)throw Error('Material unavailable');const data=await response.json();const book=data.books[Number(b)],chapter=book?.chapters[Number(c)];if(!chapter)throw Error('Chapter not found');title=chapter.title;source=book.book;summary=chapter.summary;points=chapter.points;exam=chapter.exam;subject=s;
 }else if(id.startsWith('survey:')){const response=await fetch('/data/economic-survey.json');if(!response.ok)throw Error('Survey unavailable');const data=await response.json(),chapter=data.chapters.find(c=>'survey:'+c.id===id);if(!chapter)throw Error('Chapter not found');title=chapter.title;source=data.title;points=chapter.points;exam=chapter.exam;subject='survey';
 }else throw Error('Choose study material from the Planner library.');
 document.title=title+' | Crack IAS';host.innerHTML='<p class="eyebrow">'+esc(source)+'</p><h1>'+esc(title)+'</h1>'+(summary?'<p>'+esc(summary)+'</p>':'')+'<ul>'+(points||[]).map(point=>'<li>'+esc(point)+'</li>').join('')+'</ul>'+(exam?'<p><strong>For the exam:</strong> '+esc(exam)+'</p>':'')+'<div class="actions"><a class="button primary" href="'+esc(StudyData.practiceUrl(subject))+'">Practice subject</a><a class="button" href="/planner.html?material='+encodeURIComponent(id)+'">Schedule this topic</a><a class="button" href="/library?subject='+esc(subject)+'">Source library</a></div>';
 if(id.startsWith('ncert-note:'))host.insertAdjacentHTML('beforeend','<p class="note">Revision notes follow older NCERT editions. Check the current publisher edition in the source library.</p>');
}catch(error){host.replaceChildren(Object.assign(document.createElement('p'),{textContent:error.message}));}})();
