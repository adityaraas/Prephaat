<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 611" role="img" aria-labelledby="ed-diagram-title ed-diagram-desc"><title id="ed-diagram-title">Safety and agency</title><desc id="ed-diagram-desc">Simplified original concept map. Branches explain connected dimensions, not a timeline or a claim that one factor guarantees an outcome. Protection: Public institutions have responsibilities for safer spaces and responsive services. Agency: Women retain the freedom to study, work, travel and participate in public life. Accountability: Assess perpetrators and institutional failures rather than shifting the burden to restrictions on women.</desc><rect width="760" height="611" rx="20" fill="#f1f6f0"/><rect x="30" y="28" width="700" height="82" rx="14" fill="#244f42"/><text x="52" y="61" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Safety and agency</text><path d="M65 110V195H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="145" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="175" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Protection</text><text x="120" y="210" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Public institutions have responsibilities for safer spaces and responsive</text><text x="120" y="231" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">services.</text><path d="M65 110V352H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="302" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="332" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Agency</text><text x="120" y="367" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Women retain the freedom to study, work, travel and participate in public</text><text x="120" y="388" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">life.</text><path d="M65 110V509H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="459" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="489" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Accountability</text><text x="120" y="524" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Assess perpetrators and institutional failures rather than shifting the</text><text x="120" y="545" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">burden to restrictions on women.</text></svg>