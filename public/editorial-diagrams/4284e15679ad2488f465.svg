<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 599" role="img" aria-labelledby="ed-diagram-title ed-diagram-desc"><title id="ed-diagram-title">Electoral inclusion and verification</title><desc id="ed-diagram-desc">Simplified original concept map. Branches explain connected dimensions, not a timeline or a claim that one factor guarantees an outcome. Accuracy: Verification aims to keep electoral records accurate. Exclusion risk: Documentation barriers and errors can prevent eligible voters from remaining on the roll. Safeguards: Accessible notice, reasons, correction opportunities and review help balance accuracy and inclusion.</desc><rect width="760" height="599" rx="20" fill="#f1f6f0"/><rect x="30" y="28" width="700" height="82" rx="14" fill="#244f42"/><text x="52" y="61" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Electoral inclusion and verification</text><path d="M65 110V195H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="145" width="630" height="125" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="175" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Accuracy</text><text x="120" y="210" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Verification aims to keep electoral records accurate.</text><path d="M65 110V340H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="290" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="320" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Exclusion risk</text><text x="120" y="355" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Documentation barriers and errors can prevent eligible voters from remaining</text><text x="120" y="376" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">on the roll.</text><path d="M65 110V497H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="447" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="477" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Safeguards</text><text x="120" y="512" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Accessible notice, reasons, correction opportunities and review help balance</text><text x="120" y="533" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">accuracy and inclusion.</text></svg>