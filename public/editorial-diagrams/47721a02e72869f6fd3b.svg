<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 587" role="img" aria-labelledby="ed-diagram-title ed-diagram-desc"><title id="ed-diagram-title">Trade margins in medicine</title><desc id="ed-diagram-desc">Simplified original concept map. Branches explain connected dimensions, not a timeline or a claim that one factor guarantees an outcome. Procurement price: The hospital acquires a medicine at one price. Patient price: The patient is charged a higher selling price. Incentive: A larger margin can reward selection of costly brands; regulation must also preserve supply.</desc><rect width="760" height="587" rx="20" fill="#f1f6f0"/><rect x="30" y="28" width="700" height="82" rx="14" fill="#244f42"/><text x="52" y="61" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Trade margins in medicine</text><path d="M65 110V195H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="145" width="630" height="125" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="175" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Procurement price</text><text x="120" y="210" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">The hospital acquires a medicine at one price.</text><path d="M65 110V340H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="290" width="630" height="125" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="320" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Patient price</text><text x="120" y="355" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">The patient is charged a higher selling price.</text><path d="M65 110V485H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="435" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="465" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Incentive</text><text x="120" y="500" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">A larger margin can reward selection of costly brands; regulation must also</text><text x="120" y="521" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">preserve supply.</text></svg>