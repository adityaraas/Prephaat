<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 599" role="img" aria-labelledby="ed-diagram-title ed-diagram-desc"><title id="ed-diagram-title">Outcome-based policing</title><desc id="ed-diagram-desc">Simplified original concept map. Branches explain connected dimensions, not a timeline or a claim that one factor guarantees an outcome. Inputs: Money, staff and equipment are resources for policing. Outputs: Patrols, complaints processed and response times describe activities and delivery. Outcomes: Evaluate safety and access to justice; consider reporting changes before interpreting crime counts.</desc><rect width="760" height="599" rx="20" fill="#f1f6f0"/><rect x="30" y="28" width="700" height="82" rx="14" fill="#244f42"/><text x="52" y="61" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">Outcome-based policing</text><path d="M65 110V195H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="145" width="630" height="125" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="175" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Inputs</text><text x="120" y="210" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Money, staff and equipment are resources for policing.</text><path d="M65 110V340H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="290" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="320" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Outputs</text><text x="120" y="355" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Patrols, complaints processed and response times describe activities and</text><text x="120" y="376" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">delivery.</text><path d="M65 110V497H98" stroke="#91aa96" stroke-width="3" fill="none"/><rect x="100" y="447" width="630" height="137" rx="12" fill="#ffffff" stroke="#b9cdbd"/><text x="120" y="477" font-family="Arial, sans-serif" font-size="18" fill="#244f42">Outcomes</text><text x="120" y="512" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">Evaluate safety and access to justice; consider reporting changes before</text><text x="120" y="533" font-family="Arial, sans-serif" font-size="14" fill="#374a3d">interpreting crime counts.</text></svg>