services:
  - type: web
    name: prephaat
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: EDITORIAL_MODEL
        value: gemini-3.1-flash-lite-preview
